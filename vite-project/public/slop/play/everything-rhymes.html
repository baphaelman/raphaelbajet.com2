<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Everything Rhymes</title>
<meta name="description" content="Rhyme X-ray colors about half the syllables of a rap #1, and about as many in random words. Tested against chance, the rhyme that's left sits at the end of the bar, and it has faded since 1989.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Scrollytelling: text steps on the left, a sticky stage on the right (the Comma Pump's frame).
   On phones the stage sits on top and the text flows underneath it. */
:root {
  --bg: #f4f5f8; --panel: #ffffff; --stage: #e8ebf1; --stage-hi: #f8f9fb;
  --ink: #14161b; --ink-2: #4a4f5a; --ink-3: #7b8190; --rule: #d9dde5; --grid: #e3e6ec;
  --accent: #2a78d6; --accent-ink: #1c5cab;
  /* series: real (slot 1), same words shuffled (slot 2), a third series (slot 3); random is the gray reference */
  --real: #2a78d6; --shuf: #eb6834; --third: #1baf7a; --rand: #8a909c; --rand-band: rgba(138,144,156,.16);
  /* rhyme chips, Rhyme X-ray's recipe (OKLCH lightness and chroma per theme) */
  --chip-l: 0.87; --chip-c: 0.09; --on-chip: #12151b;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --stage-h: 58svh;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --panel: #191c23; --stage: #151920; --stage-hi: #222935;
    --ink: #eceef2; --ink-2: #b7bcc7; --ink-3: #8a909c; --rule: #2b303a; --grid: #252a33;
    --accent: #5598e7; --accent-ink: #86b6ef;
    --real: #3987e5; --shuf: #d95926; --third: #199e70; --rand: #7b8190; --rand-band: rgba(123,129,144,.2);
    --chip-l: 0.42; --chip-c: 0.085; --on-chip: #f5f7fb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --panel: #191c23; --stage: #151920; --stage-hi: #222935;
  --ink: #eceef2; --ink-2: #b7bcc7; --ink-3: #8a909c; --rule: #2b303a; --grid: #252a33;
  --accent: #5598e7; --accent-ink: #86b6ef;
  --real: #3987e5; --shuf: #d95926; --third: #199e70; --rand: #7b8190; --rand-band: rgba(123,129,144,.2);
  --chip-l: 0.42; --chip-c: 0.085; --on-chip: #f5f7fb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1.1rem; line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.08; letter-spacing: -0.01em; margin: 0 0 0.7rem; }
h1 { font-size: clamp(2.6rem, 6.5vw, 4.4rem); font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: 1.65rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; margin-top: 1.6rem; }
p { margin: 0 0 0.9rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.76rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.note { font-size: 0.93rem; color: var(--ink-2); }
kbd { font-family: var(--f-mono); font-size: 0.78rem; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; }
code, .code { font-family: var(--f-mono); font-size: 0.84em; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Scrolly frame */
.scrolly { position: relative; display: grid; grid-template-columns: minmax(0, 29rem) minmax(0, 1fr); column-gap: clamp(24px, 4vw, 60px); max-width: 1360px; margin: 0 auto; }
.steps { grid-column: 1; grid-row: 1; padding-bottom: 40vh; min-width: 0; }
.stage-col { grid-column: 2; grid-row: 1; position: relative; min-width: 0; }
.stage { position: sticky; top: 0; height: 100vh; padding-block: 18px; }
.stage-inner { position: relative; height: 100%; border-radius: 22px; overflow: hidden; border: 1px solid var(--rule); background: radial-gradient(120% 90% at 50% 40%, var(--stage-hi), var(--stage)); }
.step { min-height: 92vh; display: flex; align-items: center; }
.step.tall { min-height: calc(var(--n, 2) * 80vh); align-items: flex-start; }
.step.tall .card { position: sticky; top: 14vh; }
.step:first-child { min-height: 100vh; }
.card { max-width: 29rem; width: 100%; min-width: 0; padding-block: 24px; }
.step .card { opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s; }
.step.cur .card { opacity: 1; visibility: visible; transition: opacity .55s ease .1s, visibility 0s; }
.card [data-b].fut, .card [data-b].past { display: none; }
.card [data-b].now { animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Stage chrome */
.nav { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; z-index: 5; }
.segs { flex: 1; display: flex; gap: 3px; min-width: 0; }
.seg { flex: 1; height: 16px; padding: 0; border: 0; background: none; cursor: pointer; position: relative; min-width: 0; }
.seg::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: var(--rule); transition: background .3s, transform .3s; }
.seg.done::before { background: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.seg.cur::before { background: var(--accent); transform: scaleY(1.6); }
.key { font-family: var(--f-mono); font-size: 0.9rem; font-weight: 600; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--rule); border-bottom-width: 3px; background: var(--panel); color: var(--ink); cursor: pointer; }
.key:hover { border-color: var(--accent); }
.key.press, .key:active { transform: translateY(2px); border-bottom-width: 1px; }
.subnav { position: absolute; top: 48px; left: 16px; right: 14px; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.slideno { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.slideno b { color: var(--ink); font-weight: 600; }
.pips { display: inline-flex; gap: 5px; }
.pip { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-3); transition: background .25s, border-color .25s; }
.pip.on { background: var(--accent); border-color: var(--accent); }
.themebtn { font-family: var(--f-mono); font-size: 0.8rem; border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2); border-radius: 99px; padding: 3px 10px; cursor: pointer; }
.themebtn:hover { border-color: var(--accent); }

/* Layers */
.layer { position: absolute; inset: 0; padding: 86px clamp(14px, 3vw, 30px) 18px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: scale(0.97); visibility: hidden; pointer-events: none; transition: opacity .5s ease, transform .5s ease, visibility 0s linear .5s; }
.layer.on { opacity: 1; transform: none; visibility: visible; pointer-events: auto; transition: opacity .5s ease, transform .5s ease, visibility 0s; }
.lay-head { display: grid; gap: 2px; }
.lay-title { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.lay-sub { font-size: 0.9rem; color: var(--ink-2); line-height: 1.4; }
.viz { position: relative; flex: 1 1 auto; min-height: 140px; }
.viz > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.ctrls { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.btn { font-family: var(--f-display); font-weight: 600; font-size: 0.86rem; line-height: 1; border-radius: 99px; padding: 8px 13px; cursor: pointer; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: 99px; padding: 2px; background: var(--panel); gap: 2px; flex-wrap: wrap; }
.seg-ctl .btn { border: 0; padding: 7px 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--f-mono); font-size: 0.74rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
.legend i.chip { width: 14px; height: 12px; border-radius: 3px; background: oklch(var(--chip-l) var(--chip-c) 200); }
.legend i.chip.soft { background: oklch(var(--chip-l) var(--chip-c) 200 / .42); }
.legend i.ul { width: 14px; height: 0; border-bottom: 2px solid var(--ink-2); border-radius: 0; }
.legend i.dash { background: none; border-top: 2px dashed var(--ink-3); height: 0; }
.tip { position: absolute; z-index: 8; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 10px; font-family: var(--f-display); font-size: 0.8rem; line-height: 1.35; color: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.14); max-width: 260px; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip .k { font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-2); }
.tip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.tbl-toggle { font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-3); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.datatable { display: none; max-height: 40%; overflow: auto; font-size: 0.78rem; }
.datatable.on { display: block; }
.datatable table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.datatable th, .datatable td { border-bottom: 1px solid var(--rule); padding: 3px 6px; text-align: right; font-family: var(--f-mono); }
.datatable th:first-child, .datatable td:first-child { text-align: left; font-family: var(--f-display); }

/* Verse (Rhyme X-ray's ink chips) */
.verse { font-family: var(--f-display); font-size: clamp(1.05rem, 1.9vw, 1.45rem); line-height: 2.05; font-weight: 500; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 16px 20px; }
.verse .ln { display: block; }
.verse .syl { border-radius: 4px; }
.verse .syl.g { color: var(--on-chip); background: oklch(calc(var(--chip-l) + var(--dl, 0)) var(--chip-c) var(--h)); padding: .12em 0; }
.verse .syl.g.soft { color: var(--ink); background: oklch(calc(var(--chip-l) + var(--dl, 0)) var(--chip-c) var(--h) / .42); }
.verse .syl.mu { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; text-decoration-color: var(--ink-2); }
.verse .fn { color: var(--ink-2); }
.verse.wait { color: var(--ink-3); font-size: 1rem; line-height: 1.5; }
#L-verse { justify-content: center; }
.readout { display: flex; gap: 6px 22px; flex-wrap: wrap; align-items: baseline; }
.readout div { display: grid; }
.readout .lbl { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.readout b { font-family: var(--f-display); font-size: 1.7rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.readout b.sm { font-size: 1rem; padding-top: 6px; }

/* Try a song */
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; font-family: var(--f-display); font-size: 0.95rem; padding: 9px 14px; border-radius: 99px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
.results { display: grid; gap: 4px; }
.results button { text-align: left; font-family: var(--f-display); font-size: 0.86rem; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; }
.results button:hover { border-color: var(--accent); }
.results button span { color: var(--ink-2); }
.tryout { display: grid; gap: 10px; }
.verdict { font-size: 1rem; line-height: 1.45; }
.status { font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-2); min-height: 1.2em; }

/* Appendix */
.after { max-width: 46rem; margin: 0 auto; padding: 10vh 0 140px; }
.after ul { padding-left: 1.2rem; }
.after li { margin-bottom: .5rem; }

@media (max-width: 900px) {
  body { font-size: 1.02rem; }
  .scrolly { display: flex; flex-direction: column; }
  .stage-col { order: -1; position: sticky; top: 0; z-index: 3; height: 58vh; height: var(--stage-h); background: var(--bg); }
  .stage { position: relative; height: 100%; padding-block: 8px 6px; }
  .stage-inner { border-radius: 16px; }
  .layer { padding: 74px 12px 10px; gap: 8px; }
  .lay-sub, .hide-phone { display: none !important; }
  .subnav { top: 46px; }
  .step, .step:first-child, .step.tall { min-height: 0; display: block; padding-bottom: 16vh; }
  .step .card, .step.tall .card { position: static; padding-block: 18px 0; max-width: none; opacity: .35; visibility: visible; transition: opacity .35s; }
  .step.cur .card { opacity: 1; }
  .card [data-b] { margin-bottom: 38vh; transition: opacity .35s; }
  .card [data-b]:last-child { margin-bottom: 0; }
  .card [data-b].fut, .card [data-b].past { display: block; opacity: .38; }
  .card [data-b].now { animation: none; }
  .steps { padding-bottom: 20vh; }
  h1 { font-size: 2.3rem; }
  h2 { font-size: 1.35rem; }
  #L-verse { justify-content: flex-start; }
  #L-verse .legend { display: none; }
  .verse { padding: 8px 12px; font-size: 1rem; line-height: 1.85; }
  .seg-ctl .btn { padding: 6px 9px; font-size: 0.74rem; }
  .readout { gap: 2px 16px; }
  .readout .lbl { font-size: 0.6rem; }
  .readout b, .readout b.sm { font-size: 1.1rem; padding-top: 0; }
  .viz + .legend { margin-top: 4px; }
  .btn { font-size: 0.8rem; padding: 7px 10px; }
  .legend { font-size: 0.66rem; gap: 2px 10px; }
  .after { padding-top: 6vh; }
}
@media (prefers-reduced-motion: reduce) {
  .layer, .step .card, .card [data-b] { transition: none !important; animation: none !important; }
}
</style>

</head>
<body>

<div class="scrolly">
  <div class="steps">

    <section class="step" data-scene="hero">
      <div class="card">
        <div data-slop-meter></div>
        <div class="eyebrow" data-slop="hero.eyebrow"></div>
        <h1 data-slop="hero.title"></h1>
        <p data-slop="hero.p1"></p>
        <p data-slop="hero.p2"></p>
        <p class="note" data-slop="hero.note"></p>
      </div>
    </section>

    <section class="step tall" data-scene="xray" data-n="2" style="--n:2">
      <div class="card">
        <div class="eyebrow" data-slop="xray.eyebrow"></div>
        <h2 data-slop="xray.title"></h2>
        <p data-b="0" data-slop="xray.p1"></p>
        <p data-b="1" data-slop="xray.p2"></p>
      </div>
    </section>

    <section class="step tall" data-scene="swap" data-n="3" style="--n:3">
      <div class="card">
        <div class="eyebrow" data-slop="swap.eyebrow"></div>
        <h2 data-slop="swap.title"></h2>
        <p data-b="0" data-slop="swap.p1"></p>
        <p data-b="1" data-slop="swap.p2"></p>
        <p data-b="2" data-slop="swap.p3"></p>
      </div>
    </section>

    <section class="step tall" data-scene="end" data-n="2" style="--n:2">
      <div class="card">
        <div class="eyebrow" data-slop="end.eyebrow"></div>
        <h2 data-slop="end.title"></h2>
        <p data-b="0" data-slop="end.p1"></p>
        <p data-b="1" data-slop="end.p2"></p>
      </div>
    </section>

    <section class="step tall" data-scene="place" data-n="2" style="--n:2">
      <div class="card">
        <div class="eyebrow" data-slop="place.eyebrow"></div>
        <h2 data-slop="place.title"></h2>
        <p data-b="0" data-slop="place.p1"></p>
        <p data-b="1" data-slop="place.p2"></p>
      </div>
    </section>

    <section class="step" data-scene="strict">
      <div class="card">
        <div class="eyebrow" data-slop="strict.eyebrow"></div>
        <h2 data-slop="strict.title"></h2>
        <p data-slop="strict.p1"></p>
      </div>
    </section>

    <section class="step tall" data-scene="years" data-n="3" style="--n:3">
      <div class="card">
        <div class="eyebrow" data-slop="years.eyebrow"></div>
        <h2 data-slop="years.title"></h2>
        <p data-b="0" data-slop="years.p1"></p>
        <p data-b="1" data-slop="years.p2"></p>
        <p data-b="2" data-slop="years.p3"></p>
      </div>
    </section>

    <section class="step" data-scene="try">
      <div class="card">
        <div class="eyebrow" data-slop="try.eyebrow"></div>
        <h2 data-slop="try.title"></h2>
        <p data-slop="try.p1"></p>
      </div>
    </section>

  </div>

  <div class="stage-col" id="stagecol">
    <div class="stage">
      <div class="stage-inner" id="stage">
        <div class="nav">
          <button class="key" id="k-prev" aria-label="Previous">←</button>
          <div class="segs" id="segs"></div>
          <button class="key" id="k-next" aria-label="Next">→</button>
        </div>
        <div class="subnav">
          <div class="slideno" id="slideno"></div>
          <button class="themebtn" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme">◐</button>
        </div>

        <!-- The verse: hero, the X-ray's reading, random sounds -->
        <div class="layer" id="L-verse">
          <div class="lay-head"><div class="lay-title" data-slop="xray.stage.title"></div><div class="lay-sub" id="vs-sub"></div></div>
          <div class="seg-ctl" role="group" aria-label="Which version" id="vs-ver">
            <button class="btn on" data-v="real">Real</button>
            <button class="btn" data-v="shuffled">Same words, shuffled</button>
            <button class="btn" data-v="random">Random sounds</button>
          </div>
          <div class="verse wait" id="vs-verse"></div>
          <div class="readout">
            <div><span class="lbl">Syllables colored</span><b id="vs-share">–</b></div>
            <div><span class="lbl">Bars ending on a perfect rhyme</span><b id="vs-end" class="sm">–</b></div>
            <div class="spacer"></div>
          </div>
          <div class="ctrls"><button class="btn" id="vs-draw" hidden>New draw</button></div>
          <div class="legend"><span><i class="chip"></i>a rhyme (one color per rhyme)</span><span><i class="chip soft"></i>vowel only</span><span><i class="ul"></i>multisyllabic</span></div>
        </div>

        <!-- Every song: real vs random -->
        <div class="layer" id="L-scatter">
          <div class="lay-head"><div class="lay-title" data-slop="swap.stage.title"></div><div class="lay-sub" data-slop="swap.stage.sub"></div></div>
          <div class="viz" id="sc-viz"><svg id="sc-svg" role="img" aria-label="Scatter plot: each song's share of syllables colored, real against random copies"></svg><div class="tip" id="sc-tip"></div></div>
          <div class="legend"><span><i class="dot" style="background:var(--real)"></i>a song</span><span><i class="dash"></i>real = random</span></div>
          <button class="tbl-toggle" data-table="sc">Table</button>
          <div class="datatable" id="sc-table"></div>
        </div>

        <!-- Rhyme by position from the bar's end -->
        <div class="layer" id="L-profile">
          <div class="lay-head"><div class="lay-title" id="pf-title"></div><div class="lay-sub" data-slop="end.stage.sub"></div></div>
          <div class="viz" id="pf-viz"><svg id="pf-svg" role="img" aria-label="Line chart: share of syllables that rhyme, by position from the end of the bar"></svg><div class="tip" id="pf-tip"></div></div>
          <div class="legend" id="pf-legend"></div>
          <button class="tbl-toggle" data-table="pf">Table</button>
          <div class="datatable" id="pf-table"></div>
        </div>

        <!-- Settings -->

<script id="rx-lib">
/* Everything Rhymes: the study, as pure functions over Rhyme X-ray's engine (globalThis.RhymeEngine).
   The page runs this for its demos and the "Try a song" panel; tools/rx.mjs runs the same code, read out of
   the page, for the 325 songs. Nothing here touches the DOM. */
(function (root) {
  'use strict';
  const E = () => root.RhymeEngine;
  const RX = {};

  // The X-ray's settings: its defaults (a shared vowel counts, a word rhymes with itself), Near, Perfect, and
  // "ends": perfect rhymes with a different word, for end rhymes that aren't repeats ("endsNear" and
  // "endsAsso": the same, with near rhymes or a shared vowel allowed).
  RX.SETTINGS = {
    def: { tier: 2, identical: true }, near: { tier: 1, identical: true },
    perfect: { tier: 0, identical: true }, ends: { tier: 0, identical: false },
    endsNear: { tier: 1, identical: false }, endsAsso: { tier: 2, identical: false }
  };

  // Seeded PRNG (mulberry32), so a seed always gives the same shuffle.
  RX.rng = seed => {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  RX.shuffle = (arr, r) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /** Lyrics minus what isn't sung: LRC timestamps, and tags such as "[E]" or "[Verse 2: X]" inside a line. */
  RX.clean = t => t.replace(/\[\d+:\d+(?:[.:]\d+)?\]/g, '').split('\n')
    .map(l => /^\s*\[[^\]]*\]\s*$/.test(l) ? l : l.replace(/\[[^\]]*\]/g, ' ')).join('\n');

  /**
   * A song as sections of bars, each bar the words the X-ray keeps (ad-libs and punctuation dropped).
   * A section that repeats an earlier one word for word (a second chorus) is dropped. With unique, so is
   * every bar sung before, so hooks and refrains count once.
   */
  RX.bars = (text, unique) => {
    const A = E().analyse(RX.clean(text));
    const secs = []; let cur = null, last = -1;
    for (const L of A.lines) {
      if (L.n < 0) continue;
      if (L.section !== last) { cur = []; secs.push(cur); last = L.section; }
      const ws = L.words.filter(W => !W.adlib).map(W => W.text.replace(/[’‘`]/g, "'"));
      if (ws.length) cur.push(ws);
    }
    if (unique) {
      const once = new Set();
      secs.forEach((s, j) => { secs[j] = s.filter(b => { const k = b.join(' ').toLowerCase(); if (once.has(k)) return false; once.add(k); return true; }); });
    }
    const seen = new Set();
    return secs.filter(s => {
      if (!s.length) return false;
      const k = s.map(b => b.join(' ').toLowerCase()).join('\n');
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
  };
  RX.text = secs => secs.map(s => s.map(b => b.join(' ')).join('\n')).join('\n\n');

  // The engine's function words (engine.js STOP). The X-ray never compares them on their own; both
  // versions below leave them where they are.
  RX.STOP = new Set(("a an the to of and in on at is it its i im i'm my me you your we he she they them " +
    'but or for with that this as be was are so if do by from up our us his her him not no').split(' '));
  RX.key = w => w.toLowerCase().replace(/[’‘`]/g, "'");
  RX.isStop = w => RX.STOP.has(RX.key(w).replace(/^'+|'+$/g, ''));

  /** Each word's stress pattern ("10" for "money"), from the reading the X-ray chose: [[word, pattern]…]. */
  RX.patterns = secs => {
    const out = [];
    for (const L of E().analyse(RX.text(secs)).lines) for (const W of L.words) if (!W.adlib) out.push([W.text, (W.syls || []).map(s => s.stress > 0 ? 1 : 0).join('')]);
    return out;
  };

  /** Same words, shuffled: a section's content words in random content slots; function words stay put. */
  RX.shuffled = (secs, r) => secs.map(s => {
    const w = RX.shuffle(s.flat().filter(x => !RX.isStop(x)), r); let k = 0;
    return s.map(b => b.map(x => RX.isStop(x) ? x : w[k++]));
  });

  /** The word pool: {pattern: "word word*count …"} (count 1 unwritten) → Map pattern → {words, cum, total}. */
  RX.pool = obj => {
    const m = new Map();
    for (const [p, s] of Object.entries(obj)) {
      const words = [], cum = []; let t = 0;
      for (const tok of s.split(' ')) { const i = tok.lastIndexOf('*'); const w = i > 0 ? tok.slice(0, i) : tok; t += i > 0 ? +tok.slice(i + 1) : 1; words.push(w); cum.push(t); }
      m.set(p, { words, cum, total: t });
    }
    return m;
  };
  const draw = (P, r) => { const x = r() * P.total; let lo = 0, hi = P.cum.length - 1; while (lo < hi) { const mid = (lo + hi) >> 1; if (P.cum[mid] > x) hi = mid; else lo = mid + 1; } return P.words[lo]; };

  /**
   * Random sounds: each distinct content word becomes, everywhere it occurs, one random content word with
   * its stress pattern, drawn by how often the 325 songs use it (no two words share a stand-in). Rhythm,
   * function words and repeats stay; only the sounds are random. own: Map word → pattern for this song.
   */
  RX.swapped = (secs, r, pool, own) => {
    const map = new Map(), used = new Set();
    const sub = w => {
      if (RX.isStop(w)) return w;
      const k = RX.key(w);
      if (!map.has(k)) {
        const P = pool.get(own.get(k));
        let x = w;
        if (P) for (let t = 0; t < 20; t++) { x = draw(P, r); if (!used.has(x)) break; }
        used.add(x); map.set(k, x);
      }
      return map.get(k);
    };
    return secs.map(s => s.map(b => b.map(sub)));
  };
  RX.own = secs => { const m = new Map(); for (const [w, p] of RX.patterns(secs)) m.set(RX.key(w), p); return m; };

  // A word's stem, to tell repetition from rhyme: "Monie's" and "Monie" are one word, "rap" and "crap" two.
  const stem = W => RX.key(W.text).replace(/[^a-z0-9']/g, '').replace(/'s$|s'$|'$/, '').replace(/^'/, '').replace(/([^s])s$/, '$1');
  /**
   * The X-ray's multis that rhyme in at least two positions with different words. Its own rule drops a run
   * only when every word repeats, so a refrain sung with one word changed ("Monie in the middle" / "Monie's
   * in the middle") counts as a 10-syllable rhyme. Rhyme-carrying positions as in engine.js: a stressed
   * vowel matching, or an unstressed content syllable matching at near or better.
   */
  RX.realRuns = A => {
    const { NEAR, ASSONANCE } = E().TIERS;
    return A.runs.filter(r => r.tiers.filter((t, k) => {
      const a = r.a[k], b = r.b[k];
      if (t === null || t > ASSONANCE) return false;
      if (!(a.stress > 0 || b.stress > 0 || (t <= NEAR && !a.stop && !b.stop))) return false;
      return stem(a.word) !== stem(b.word);
    }).length >= 2);
  };

  RX.POS = 12; // profile positions, counted from the bar's end; the last bucket is "12 or more"
  /** One X-ray result's numbers, and its profile by position from the bar's end. */
  RX.measure = A => {
    const { PERFECT, NEAR, ASSONANCE } = E().TIERS;
    const syl = A.syllables.filter(s => s.line >= 0), n = syl.length;
    const col = syl.filter(s => s.group != null);
    const runs = RX.realRuns(A), inMulti = new Set();
    runs.forEach(r => [...r.a, ...r.b].forEach(s => inMulti.add(s.id)));
    const body = A.lines.filter(L => L.n >= 0 && L.syls.length);
    const ends = body.map(L => L.syls[L.syls.length - 1]);
    const P = RX.POS, prof = { n: new Array(P + 1).fill(0), c: new Array(P + 1).fill(0), pn: new Array(P + 1).fill(0), m: new Array(P + 1).fill(0) };
    for (const L of body) L.syls.forEach((s, i) => {
      const k = Math.min(L.syls.length - i, P);
      prof.n[k]++;
      if (s.group != null) { prof.c[k]++; if (s.tier <= NEAR) prof.pn[k]++; }
      if (inMulti.has(s.id)) prof.m[k]++;
    });
    return {
      syl: n, bars: body.length,
      share: col.length / n,
      perfect: col.filter(s => s.tier === PERFECT).length / n,
      near: col.filter(s => s.tier === NEAR).length / n,
      asso: col.filter(s => s.tier === ASSONANCE).length / n,
      multi: inMulti.size / n,
      runs: runs.length,
      longest: runs.reduce((m, r) => Math.max(m, r.len), 0),
      endPerfect: ends.filter(s => s.group != null && s.tier === PERFECT).length / ends.length,
      endRhyme: ends.filter(s => s.group != null && s.tier <= ASSONANCE).length / ends.length,
      prof
    };
  };

  const addInto = (acc, m, w) => {
    for (const k in m) {
      if (k === 'prof') { acc.prof = acc.prof || { n: [], c: [], pn: [], m: [] }; for (const q in m.prof) m.prof[q].forEach((v, j) => { acc.prof[q][j] = (acc.prof[q][j] || 0) + v * w; }); }
      else acc[k] = (acc[k] || 0) + m[k] * w;
    }
  };
  /**
   * The study for one song at one setting: the X-ray on the real bars, on K "same words, shuffled" and on K
   * "random sounds" versions (means). each(i) is called between analyses, so a page can yield.
   */
  RX.study = async (secs, opts, pool, K, seed, each) => {
    const r = RX.rng(seed), own = RX.own(secs);
    const out = { real: RX.measure(E().analyse(RX.text(secs), opts)), shuffled: {}, random: {} };
    for (let k = 0; k < K; k++) {
      addInto(out.shuffled, RX.measure(E().analyse(RX.text(RX.shuffled(secs, r)), opts)), 1 / K);
      if (each) await each();
      addInto(out.random, RX.measure(E().analyse(RX.text(RX.swapped(secs, r, pool, own)), opts)), 1 / K);
      if (each) await each();
    }
    return out;
  };

  root.RX = RX;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

/* ---------- The X-ray, live: engine (script tag) + dictionary (import) ---------- */
const HUES = [20, 50, 80, 110, 140, 170, 200, 230, 260, 290, 320, 350, 65, 245]; // Rhyme X-ray's 14 colors
const DL = {12: -0.16, 13: 0.06};
let dictReady = null;
function loadDict() {
  if (!dictReady) dictReady = import(DICT_URL).then(m => { RhymeEngine.setDictionary(m.dictionary); return true; });
  return dictReady;
}
const POOL = D.pool ? RX.pool(D.pool) : new Map();
const DOOM = "A little grease always keeps the wheels a-spinnin'\nLike sitting on twenty threes to get the squealers grinnin'";

/** A verse as Rhyme X-ray's ink chips, from one engine result. */
function verseHTML(A) {
  const multi = new Set(); RX.realRuns(A).forEach(r => [...r.a, ...r.b].forEach(s => multi.add(s.id)));
  return A.lines.filter(L => L.n >= 0).map(L => {
    let o = '', at = 0;
    for (const W of L.words) {
      o += esc(L.raw.slice(at, W.s));
      const syls = W.syls || [];
      if (!syls.length) { o += `<span class="fn">${esc(L.raw.slice(W.s, W.e))}</span>`; at = W.e; continue; }
      let p = W.s;
      syls.forEach((s, k) => {
        const e = k === syls.length - 1 ? W.e : s.ce;
        if (s.cs > p) o += esc(L.raw.slice(p, s.cs));
        const g = s.group != null ? A.groups[s.group] : null;
        const cls = 'syl' + (g ? ' g' + (s.soft ? ' soft' : '') : '') + (multi.has(s.id) ? ' mu' : '');
        const st = g ? ` style="--h:${HUES[g.color % HUES.length]};--dl:${DL[g.color] || 0}"` : '';
        o += `<span class="${cls}"${st}>${esc(L.raw.slice(Math.max(p, s.cs), e))}</span>`;
        p = e;
      });
      at = W.e;
    }
    return `<span class="ln">${o + esc(L.raw.slice(at))}</span>`;
  }).join('');
}

const VS = {ver: 'real', draw: 1, ready: false};
const doomSecs = () => RX.bars(DOOM);
function verseText() {
  const secs = doomSecs(), r = RX.rng(VS.draw * 7919);
  if (VS.ver === 'real') return RX.text(secs);
  if (VS.ver === 'shuffled') return RX.text(RX.shuffled(secs, r));
  return RX.text(RX.swapped(secs, r, POOL, RX.own(secs)));
}
function drawVerse() {
  const el = $('vs-verse');
  [...$('vs-ver').children].forEach(b => b.classList.toggle('on', b.dataset.v === VS.ver));
  $('vs-draw').hidden = VS.ver === 'real';
  if (!VS.ready) { el.classList.add('wait'); el.textContent = 'Loading the pronouncing dictionary (4.7 MB)…'; return; }
  el.classList.remove('wait');
  const A = RhymeEngine.analyse(verseText(), RX.SETTINGS.def), m = RX.measure(A);
  el.innerHTML = verseHTML(A);
  $('vs-share').textContent = pct(m.share, 0);
  $('vs-end').textContent = `${Math.round(m.endPerfect * m.bars)} of ${m.bars}`;
  $('vs-sub').textContent = VS.ver === 'real' ? 'The X-ray at its defaults.' : VS.ver === 'shuffled' ? `The same words in random places (draw ${VS.draw}).` : `Random words, same stress pattern, same little words (draw ${VS.draw}).`;
}
$('vs-ver').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { VS.ver = b.dataset.v; drawVerse(); } });
$('vs-draw').addEventListener('click', () => { VS.draw++; drawVerse(); });
loadDict().then(() => { VS.ready = true; drawVerse(); }).catch(() => { $('vs-verse').textContent = 'The pronouncing dictionary did not load, so the live demos are off.'; });

/* ---------- Charts (SVG, drawn at the container's pixel size) ---------- */
const NS = 'http://www.w3.org/2000/svg';
// layout size, not getBoundingClientRect: a layer fading in is scaled to 0.97
function box(id) { const el = $(id); return {W: Math.max(200, el.clientWidth), H: Math.max(120, el.clientHeight)}; }
const T = (x, y, s, a = {}) => `<text x="${x}" y="${y}" ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(' ')}>${s}</text>`;
const FONT = `font-family="JetBrains Mono, ui-monospace, monospace"`;
function tipAt(tipId, vizId, x, y, html) {

  tip.innerHTML = html; tip.classList.add('on');
  const b = $(vizId).getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;

}
function tableHTML(head, rows) {

}

/* Scatter: each song, real share against its random copies' */
const SC_HI = ['Watch Me (Whip/Nae Nae)', 'Rap God'];
let scGeo = null;
function drawScatter(highlight) {
  if (!D.songs) return;
  const {W, H} = box('sc-viz'), m = {l: 44, r: 14, t: 10, b: 34};
  const lo = 0.25, hi = 0.8, x = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r), y = v => H - m.b - (v - lo) / (hi - lo) * (H - m.t - m.b);
  let o = '';
  for (let v = 0.3; v <= 0.8001; v += 0.1) {
    o += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${COL.grid}" stroke-width="1"/>` + T(m.l - 6, y(v) + 4, pct(v, 0), {'text-anchor': 'end', 'font-size': 10, fill: COL['ink-3']});
    o += T(x(v), H - m.b + 16, pct(v, 0), {'text-anchor': 'middle', 'font-size': 10, fill: COL['ink-3']});
  }
  o = o.replace(/<text /g, `<text ${FONT} `);
  o += `<line x1="${x(lo)}" y1="${y(lo)}" x2="${x(hi)}" y2="${y(hi)}" stroke="${COL['ink-3']}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  o += T(W - m.r, H - 6, 'random copies →', {'text-anchor': 'end', 'font-size': 11, fill: COL['ink-2'], 'font-family': 'var(--f-display)'});
  o += T(m.l + 4, m.t + 12, '↑ real', {'font-size': 11, fill: COL['ink-2'], 'font-family': 'var(--f-display)'});

  for (const g of scGeo) o += `<circle cx="${g.cx.toFixed(1)}" cy="${g.cy.toFixed(1)}" r="3.6" fill="${COL.real}" fill-opacity="0.55" stroke="${COL.panel}" stroke-width="1"/>`;
  if (highlight) for (const g of scGeo.filter(g => SC_HI.includes(g.s[1]))) {
    o += `<circle cx="${g.cx}" cy="${g.cy}" r="6" fill="${COL.real}" stroke="${COL.panel}" stroke-width="2"/>`;

}
$('sc-viz').addEventListener('pointermove', e => {

/* Profile: rhyme by position from the bar's end */
const PF = {key: 'pn', series: ['real', 'random']};
const SERIES = {real: ['Real', 'real'], shuffled: ['Same words, shuffled', 'shuf'], random: ['Random sounds', 'rand']};
let pfGeo = null;
function drawProfile() {
  if (!D.profile) return;
  const P = D.profile, N = 10, {W, H} = box('pf-viz'), m = {l: 44, r: 104, t: 12, b: 38};
  const vals = PF.series.flatMap(s => P[s][PF.key].slice(0, N));
  const top = Math.ceil(Math.max(...vals) * 10 + 0.5) / 10;
  const x = k => m.l + (N - k) / (N - 1) * (W - m.l - m.r), y = v => H - m.b - v / top * (H - m.t - m.b);
  let o = '';
  for (let v = 0; v <= top + 1e-9; v += 0.1) o += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${COL.grid}"/>` + `<text ${FONT} x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="${COL['ink-3']}">${pct(v, 0)}</text>`;
  for (let k = 1; k <= N; k++) o += `<text ${FONT} x="${x(k)}" y="${H - m.b + 16}" text-anchor="middle" font-size="10" fill="${COL['ink-3']}">${k === 1 ? 'last' : k}</text>`;
  o += `<text x="${(m.l + W - m.r) / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${COL['ink-2']}" font-family="var(--f-display)">syllables before the bar's end</text>`;
  const ends = [];

    const c = COL[SERIES[s][1]], v = P[s][PF.key].slice(0, N);
    o += `<polyline points="${v.map((q, i) => `${x(i + 1)},${y(q)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    o += `<circle cx="${x(1)}" cy="${y(v[0])}" r="4.5" fill="${c}" stroke="${COL.panel}" stroke-width="2"/>`;
    ends.push({s, y: y(v[0]), v: v[0]});
  }
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 26) ends[i].y = ends[i - 1].y + 26;
  for (const e of ends) o += `<text x="${x(1) + 10}" y="${e.y - 2}" font-size="11" font-weight="600" fill="${COL.ink}" font-family="var(--f-display)">${SERIES[e.s][0]}</text><text ${FONT} x="${x(1) + 10}" y="${e.y + 11}" font-size="10" fill="${COL['ink-2']}">${pct(e.v)}</text>`;
  pfGeo = {x, N};
  $('pf-svg').innerHTML = o;
  $('pf-legend').innerHTML = PF.series.map(s => `<span><i style="background:var(--${SERIES[s][1]})"></i>${SERIES[s][0]}</span>`).join('');
  $('pf-table').innerHTML = tableHTML(['Syllable', ...PF.series.map(s => SERIES[s][0])], [...Array(N).keys()].map(i => [i ? `${i + 1} from the end` : 'last', ...PF.series.map(s => pct(P[s][PF.key][i]))]));
}
$('pf-viz').addEventListener('pointermove', e => {
  if (!pfGeo) return;
  const b = $('pf-viz').getBoundingClientRect(), px = e.clientX - b.left;
  let k = 1, bd = Infinity; for (let j = 1; j <= pfGeo.N; j++) { const d = Math.abs(pfGeo.x(j) - px); if (d < bd) { bd = d; k = j; } }
  tipAt('pf-tip', 'pf-viz', pfGeo.x(k), e.clientY - b.top, `<b>${k === 1 ? 'Last syllable' : k + ' from the end'}</b><br>` + PF.series.map(s => `<i style="background:${COL[SERIES[s][1]]}"></i>${SERIES[s][0]}: ${pct(D.profile[s][PF.key][k - 1])}`).join('<br>'));
});

/* Settings: real ÷ random, for syllables colored and syllables in a multi */
let tiGeo = [];

  if (!D.def) return;

  const x = v => m.l + v / vmax * (W - m.l - m.r), band = (H - m.t - m.b) / rows.length, bh = Math.min(24, band / 3.2);
  let o = '';

  }[YR.mode];

  const lab = x(1) - x(0) < 56 ? e => '’' + String(e.from).slice(2) : ERA; // a phone has room for the start year only

    $('tr-results').innerHTML = res.map((r, i) => `<button data-i="${i}">${esc(r.trackName)} <span>· ${esc(r.artistName)}</span></button>`).join('');
    $('tr-results').onclick = ev => { const b = ev.target.closest('[data-i]'); if (b) { $('tr-results').innerHTML = ''; runSong(res[+b.dataset.i]); } };
  } catch (err) { $('tr-status').textContent = 'LRCLIB did not answer. Try again in a moment.'; }
});
const tick = () => new Promise(z => setTimeout(z, 0));
async function runSong(r) {
  if (TR.busy) return; TR.busy = true;
  try {
    $('tr-status').textContent = 'Loading the pronouncing dictionary…';
    await loadDict();
    const secs = RX.bars(r.plainLyrics), K = D.K || 8, total = 3 * 2 * K; let done = 0;
    const each = async () => { done++; $('tr-status').textContent = `X-raying ${done} of ${total} versions…`; await tick(); };
    const out = {};
    for (const [name, opts] of [['def', RX.SETTINGS.def], ['ends', RX.SETTINGS.ends], ['perfect', RX.SETTINGS.perfect]]) out[name] = await RX.study(secs, opts, POOL, K, 1000, each);
    $('tr-status').textContent = '';
    TR.last = {r, out}; drawTry();
  } finally { TR.busy = false; }
}
let trGeo = [];
function drawTry() {
  if (!TR.last) return;
  const {r, out} = TR.last;
  // above chance, and the share of the 325 #1s below that
  const endEx = out.ends.real.endPerfect - out.ends.random.endPerfect, pmEx = out.perfect.real.multi - out.perfect.random.multi;
  const below = (v, col) => D.songs ? D.songs.filter(s => s[col] < v).length / D.songs.length : 0;
  $('tr-out').hidden = false;
  $('tr-verdict').innerHTML = Slop.html('try.stage.verdict', {song: {html: esc(r.trackName), data: true}, n: String(D.n),
    endEx: pct(Math.max(0, endEx), 0), endPct: pct(below(endEx, 5), 0), pmEx: pct(Math.max(0, pmEx), 1), pmPct: pct(below(pmEx, 6), 0)});
  $('tr-open').href = `https://baphaelman.github.io/rhyme-xray/?song=${r.id}`;
  const rows = [['Syllables colored', out.def, 'share'], ['Bars ending on a perfect rhyme, different word', out.ends, 'endPerfect'], ['Syllables in a perfect multi', out.perfect, 'multi']];
  const {W, H} = box('tr-viz'), m = {l: 8, r: 56, t: 4, b: 4}, band = (H - m.t - m.b) / rows.length, bh = Math.min(14, (band - 22) / 3.4);
  const top = Math.max(0.1, ...rows.flatMap(([, o, k]) => [o.real[k], o.shuffled[k], o.random[k]]));
  const x = v => m.l + v / top * (W - m.l - m.r);
  let o = ''; trGeo = [];
  rows.forEach(([name, s, k], i) => {
    const y0 = m.t + i * band;
    o += `<text x="${m.l}" y="${y0 + 13}" font-size="12" font-weight="600" fill="${COL.ink}" font-family="var(--f-display)">${name}</text>`;
    [['real', 'real'], ['shuffled', 'shuf'], ['random', 'rand']].forEach(([v, c], j) => {
      const yy = y0 + 20 + j * (bh + 2), w = Math.max(2, x(s[v][k]) - x(0));
      o += `<path d="M${x(0)},${yy} h${w - 3} q3,0 3,3 v${bh - 6} q0,3 -3,3 h${-(w - 3)} z" fill="${COL[c]}"/>`;
      o += `<text ${FONT} x="${x(0) + w + 6}" y="${yy + bh - 2}" font-size="10" fill="${COL['ink-2']}">${pct(s[v][k])}</text>`;
      trGeo.push({y0: yy, y1: yy + bh, name, v, val: s[v][k]});
    });
  });
  $('tr-svg').innerHTML = o;
}
$('tr-viz').addEventListener('pointermove', e => {
  const b = $('tr-viz').getBoundingClientRect(), py = e.clientY - b.top, g = trGeo.find(g => py >= g.y0 - 1 && py <= g.y1 + 1);
  tipAt('tr-tip', 'tr-viz', e.clientX - b.left, py, g && `<b>${SERIES[g.v][0]}</b><br><span class="k">${g.name}</span><br>${pct(g.val)}`);
});
$('tr-viz').addEventListener('pointerleave', () => tipAt('tr-tip', 'tr-viz', 0, 0, null));

/* =====================================================================
   Scenes: each has a stage layer and set(build).
   ===================================================================== */
const SC = {
  hero: {layer: 'L-verse', set() { VS.ver = 'real'; drawVerse(); }},
  xray: {layer: 'L-verse', set() { VS.ver = 'real'; drawVerse(); }},
  swap: {set(b) {
    if (b === 0) { show('L-verse'); VS.ver = 'random'; drawVerse(); }
    else { show('L-scatter'); drawScatter(b === 2); }
  }},
  end: {layer: 'L-profile', set(b) { PF.key = b ? 'm' : 'pn'; PF.series = ['real', 'random']; pfTitle(); drawProfile(); }},
  place: {layer: 'L-profile', set(b) { PF.key = b ? 'm' : 'pn'; PF.series = ['real', 'shuffled', 'random']; pfTitle(); drawProfile(); }},
  strict: {layer: 'L-tiers', set() { drawTiers(); }},
  years: {layer: 'L-years', set(b) { YR.mode = ['ends', 'above', 'tiers'][b]; yrTitle(); drawYears(); }},
  try: {layer: 'L-try', set() { drawTry(); }},
};
const pfTitle = () => { $('pf-title').innerHTML = Slop.html(PF.key === 'm' ? 'end.stage.titleMulti' : 'end.stage.titleRhyme'); $('pf-title').dataset.slopRef = PF.key === 'm' ? 'end.stage.titleMulti' : 'end.stage.titleRhyme'; };
const yrTitle = () => { const k = {ends: 'years.stage.titleEnds', above: 'years.stage.titleAbove', tiers: 'years.stage.titleTiers'}[YR.mode]; $('yr-title').innerHTML = Slop.html(k); $('yr-title').dataset.slopRef = k; };
let shown = null;
function show(layer) {
  if (shown === layer) return;
  if (shown) $(shown).classList.remove('on');
  $(layer).classList.add('on'); shown = layer;
}
function redraw() {
  readColors();
  const s = stepEls[activeIdx]?.dataset.scene;
  if (s) SC[s].set(activeBuild);
}
let rz = null;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(redraw, 120); });

/* =====================================================================
   Navigation (the Comma Pump's): every (step, build) is a stop, plus the
   appendix. ←/→ glide between stops; the stage switches at once.
   ===================================================================== */
const stepEls = [...document.querySelectorAll('.step')], afterEl = $('after');
const paras = stepEls.map(el => [...el.querySelectorAll('[data-b]')]);
const nOf = el => +el.dataset.n || 1;
const stops = []; stepEls.forEach((el, i) => { for (let b = 0; b < nOf(el); b++) stops.push({i, b}); });
stops.push({i: stepEls.length - 1, b: nOf(stepEls[stepEls.length - 1]) - 1, after: true});
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const phoneMQ = matchMedia('(max-width: 900px)'), phone = () => phoneMQ.matches;
const stageH = () => $('stagecol').offsetHeight;
const readLine = () => phone() ? stageH() + 44 : innerHeight * 0.5;
function stopY(st) {
  if (st.after) return afterEl.getBoundingClientRect().top + scrollY - 16;
  const el = stepEls[st.i], r = el.getBoundingClientRect();
  if (phone()) {
    if (st.b === 0) return el.querySelector('.card').getBoundingClientRect().top + scrollY - stageH() - 4;
    return paras[st.i][st.b].getBoundingClientRect().top + scrollY - stageH() - 20;
  }
  if (st.i === 0) return 0;
  return r.top + scrollY + ((st.b + 0.5) / nOf(el)) * r.height - readLine();
}
let glide = null, activeIdx = 0, activeBuild = 0, backRun = false;
function goStop(k) {
  k = clamp(k, 0, stops.length - 1);
  const target = clamp(stopY(stops[k]), 0, document.documentElement.scrollHeight - innerHeight), start = scrollY, dist = Math.abs(target - start);
  if (dist < 2) { glide = null; return; }
  const dur = reduce ? 0.01 : clamp(0.6 + dist / innerHeight * 0.55, 0.85, 1.5);
  glide = {start, target, t0: performance.now() / 1000, dur, k};
}
const inAfter = () => afterEl.getBoundingClientRect().top < innerHeight * 0.5;
const curStop = () => glide ? glide.k : inAfter() ? stops.length - 1 : Math.max(0, stops.findIndex(x => !x.after && x.i === activeIdx && x.b === activeBuild));
const cancelGlide = () => { glide = null; backRun = false; };
addEventListener('wheel', cancelGlide, {passive: true});
addEventListener('touchstart', e => { if (!e.target.closest('button, input, svg, label')) cancelGlide(); }, {passive: true});
const next = () => { backRun = false; goStop(curStop() + 1); };
const prev = () => {
  const c = curStop(), s = stops[c];
  goStop(backRun && !s.after ? stops.findIndex(x => x.i === s.i) - 1 : c - 1); backRun = true;
};
const pressKey = id => { const k = $(id); k.classList.add('press'); setTimeout(() => k.classList.remove('press'), 140); };
$('k-next').addEventListener('click', next); $('k-prev').addEventListener('click', prev);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select')) return;
  if ((e.key === ' ' || e.key === 'Enter') && e.target.closest('button, [role=button]')) return;
  const k = e.key.toLowerCase();
  if (['arrowright', 'arrowdown', 'pagedown', ' '].includes(k)) { e.preventDefault(); next(); pressKey('k-next'); }
  else if (['arrowleft', 'arrowup', 'pageup'].includes(k)) { e.preventDefault(); prev(); pressKey('k-prev'); }
});
// The editor (slop-editor edit) shows a stage text that's on screen only at one slide and build: it glides
// there, and back to where the reader was when it's done with it.
const showAt = (scene, b) => () => {
  const from = curStop(), i = stepEls.findIndex(el => el.dataset.scene === scene);
  goStop(stops.findIndex(x => !x.after && x.i === i && x.b === b));
  return () => goStop(from);
};
Object.entries({
  'xray.stage.title': ['xray', 0], 'swap.stage.title': ['swap', 1], 'swap.stage.sub': ['swap', 1],
  'end.stage.titleRhyme': ['end', 0], 'end.stage.titleMulti': ['end', 1], 'end.stage.sub': ['end', 0],
  'strict.stage.title': ['strict', 0], 'strict.stage.sub': ['strict', 0],
  'years.stage.titleEnds': ['years', 0], 'years.stage.titleAbove': ['years', 1], 'years.stage.titleTiers': ['years', 2], 'years.stage.sub': ['years', 0],
  'try.stage.title': ['try', 0], 'try.stage.none': ['try', 0], 'try.stage.verdict': ['try', 0],
}).forEach(([path, [scene, b]]) => Slop.reveal(path, showAt(scene, b)));
// The words, from the text block (Slop). After an edit the page refills itself; redo what's built from text.
Slop.start({code: 'code'});
const segsEl = $('segs');
stepEls.forEach((s, i) => {
  const b = document.createElement('button'); b.className = 'seg';
  b.addEventListener('click', () => { backRun = false; goStop(stops.findIndex(x => x.i === i)); }); segsEl.appendChild(b);
});
const segEls = [...segsEl.children];
function segTitles() {
  segEls.forEach((b, i) => { const h = stepEls[i].querySelector('h1, h2'), t = h ? h.textContent : ''; b.setAttribute('aria-label', `Go to ${t || 'slide ' + (i + 1)}`); b.title = t; });
}
segTitles();
Slop.onChange(() => { segTitles(); redraw(); });

function detect() {
  const line = readLine();
  for (let i = stepEls.length - 1; i >= 0; i--) {
    const r = stepEls[i].getBoundingClientRect();
    if (r.top <= line || i === 0) {
      activeIdx = i;
      if (phone()) { let b = 0; paras[i].forEach(p => { if (p.getBoundingClientRect().top <= line) b = Math.max(b, +p.dataset.b); }); activeBuild = b; }
      else activeBuild = clamp(Math.floor((line - r.top) / r.height * nOf(stepEls[i])), 0, nOf(stepEls[i]) - 1);
      return;
    }
  }
}
let curKey = '';
function frame(ms) {
  const now = ms / 1000;
  /* @render-hook */ if (glide) {
    const u = clamp((now - glide.t0) / glide.dur);
    scrollTo(0, lerp(glide.start, glide.target, (1 - Math.cos(Math.PI * u)) / 2));
    const st = stops[glide.k]; activeIdx = st.i; activeBuild = st.b;
    if (u >= 1) glide = null;
  } else detect();
  const scene = stepEls[activeIdx].dataset.scene, key = activeIdx + '/' + activeBuild;
  if (key !== curKey) {
    curKey = key;
    if (SC[scene].layer) show(SC[scene].layer);
    try { SC[scene].set(activeBuild); } catch (err) { console.error(err); }
    segEls.forEach((b, i) => { b.classList.toggle('done', i < activeIdx); b.classList.toggle('cur', i === activeIdx); });
    stepEls.forEach((el, i) => el.classList.toggle('cur', i === activeIdx));
    paras[activeIdx].forEach(el => {
      const b = +el.dataset.b; el.classList.toggle('past', b < activeBuild); el.classList.toggle('now', b === activeBuild); el.classList.toggle('fut', b > activeBuild);
    });
    const n = nOf(stepEls[activeIdx]);
    $('slideno').innerHTML = `<span><b>${activeIdx + 1}</b> / ${stepEls.length}</span>` + (n > 1 ? `<span class="pips">${[...Array(n).keys()].map(j => `<i class="pip${j <= activeBuild ? ' on' : ''}"></i>`).join('')}</span>` : '');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
