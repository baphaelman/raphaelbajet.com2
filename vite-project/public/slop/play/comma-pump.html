<!doctype html>
<html lang="en">

<title>The Comma Pump</title>
<meta name="description" content="A playable, scroll-driven explainer on musical tuning: pure ratios, the commas that keep them from fitting, the comma pump, and the temperaments that hide it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Scrollytelling: text steps on the left, a sticky stage on the right.
   On phones the stage sits on top and the text flows underneath it.
   Arrow keys / Space step between screens; each step can have several builds. */
:root {
  --bg: #f4f5f8; --panel: #ffffff; --stage: #e8ebf1; --stage-hi: #f8f9fb;
  --ink: #14161b; --ink-2: #4a4f5a; --ink-3: #7b8190; --rule: #d9dde5;
  --accent: #2a78d6; --accent-ink: #1c5cab;
  --lo: #2a78d6; --hi: #e0602c; --sum: #14161b;
  --just: #c4384f; --et: #7b8190; --good: #0f7a3c; --warn: #c27a00;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --stage-h: 58svh;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101217; --panel: #191c23; --stage: #151920; --stage-hi: #222935;
    --ink: #eceef2; --ink-2: #b7bcc7; --ink-3: #8a909c; --rule: #2b303a;
    --accent: #5598e7; --accent-ink: #86b6ef;
    --lo: #5598e7; --hi: #f07c4a; --sum: #eceef2;
    --just: #ff6b84; --et: #8a909c; --good: #4cc27a; --warn: #e5a530;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101217; --panel: #191c23; --stage: #151920; --stage-hi: #222935;
  --ink: #eceef2; --ink-2: #b7bcc7; --ink-3: #8a909c; --rule: #2b303a;
  --accent: #5598e7; --accent-ink: #86b6ef;
  --lo: #5598e7; --hi: #f07c4a; --sum: #eceef2;
  --just: #ff6b84; --et: #8a909c; --good: #4cc27a; --warn: #e5a530;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1.1rem; line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.08; letter-spacing: -0.01em; margin: 0 0 0.7rem; }
h1 { font-size: clamp(2.6rem, 6.5vw, 4.4rem); font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: 1.65rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; margin-top: 1.6rem; }
p { margin: 0 0 0.9rem; }
b.n, .num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 0.76rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.note { font-size: 0.93rem; color: var(--ink-2); }
kbd { font-family: var(--f-mono); font-size: 0.78rem; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; }
.r { font-family: var(--f-mono); font-size: 0.86em; white-space: nowrap; }
.lo { color: var(--lo); font-weight: 600; } .hi { color: var(--hi); font-weight: 600; } .ju { color: var(--just); font-weight: 600; }
sup { line-height: 0; }
a { color: var(--accent-ink); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Scrolly frame */
.scrolly { position: relative; display: grid; grid-template-columns: minmax(0, 29rem) minmax(0, 1fr); column-gap: clamp(24px, 4vw, 60px); max-width: 1360px; margin: 0 auto; }
.steps { grid-column: 1; grid-row: 1; padding-bottom: 40vh; min-width: 0; }
.stage-col { grid-column: 2; grid-row: 1; position: relative; min-width: 0; }
.stage { position: sticky; top: 0; height: 100vh; padding-block: 18px; }
.stage-inner { position: relative; height: 100%; border-radius: 22px; overflow: hidden; border: 1px solid var(--rule); background: radial-gradient(120% 90% at 50% 40%, var(--stage-hi), var(--stage)); }
.step { min-height: 92vh; display: flex; align-items: center; }
.step.tall { min-height: calc(var(--n, 2) * 80vh); align-items: flex-start; }
.step.tall .card { position: sticky; top: 14vh; }
.step:first-child { min-height: 100vh; }
.card { max-width: 29rem; width: 100%; min-width: 0; padding-block: 24px; }
.step .card { opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s; }
.step.cur .card { opacity: 1; visibility: visible; transition: opacity .55s ease .1s, visibility 0s; }
/* Builds inside a card: one paragraph at a time */
.card [data-b].fut, .card [data-b].past { display: none; }
.card [data-b].now { animation: rise .5s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Stage chrome */
.nav { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; z-index: 5; }
.segs { flex: 1; display: flex; gap: 3px; min-width: 0; }
.seg { flex: 1; height: 16px; padding: 0; border: 0; background: none; cursor: pointer; position: relative; min-width: 0; }
.seg::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: var(--rule); transition: background .3s, transform .3s; }
.seg.done::before { background: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.seg.cur::before { background: var(--accent); transform: scaleY(1.6); }
.key { font-family: var(--f-mono); font-size: 0.9rem; font-weight: 600; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--rule); border-bottom-width: 3px; background: var(--panel); color: var(--ink); cursor: pointer; }
.key:hover { border-color: var(--accent); }
.key.press, .key:active { transform: translateY(2px); border-bottom-width: 1px; }
.subnav { position: absolute; top: 48px; left: 16px; right: 14px; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
.chapters { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.chapter { font-family: var(--f-display); font-size: 0.74rem; font-weight: 600; white-space: nowrap; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--rule); background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--ink-2); cursor: pointer; }
.chapter:hover { border-color: var(--accent); }
.chapter[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.slideno { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.slideno b { color: var(--ink); font-weight: 600; }
.pips { display: inline-flex; gap: 5px; }
.pip { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-3); transition: background .25s, border-color .25s; }
.pip.on { background: var(--accent); border-color: var(--accent); }

/* Layers */
.layer { position: absolute; inset: 0; padding: 86px clamp(14px, 3vw, 30px) 18px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transform: scale(0.97); visibility: hidden; pointer-events: none; transition: opacity .5s ease, transform .5s ease, visibility 0s linear .5s; }
.layer.on { opacity: 1; transform: none; visibility: visible; pointer-events: auto; transition: opacity .5s ease, transform .5s ease, visibility 0s; }
.lay-head { display: grid; gap: 2px; }
.lay-title { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.lay-sub { font-size: 0.9rem; color: var(--ink-2); line-height: 1.4; }
.viz { position: relative; flex: 1 1 auto; min-height: 120px; }
.viz > canvas, .viz > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ctrls { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.btn { font-family: var(--f-display); font-weight: 600; font-size: 0.86rem; line-height: 1; border-radius: 99px; padding: 8px 13px; cursor: pointer; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary.on { color: #fff; }
.btn small { font-family: var(--f-mono); font-weight: 400; opacity: .8; margin-left: 4px; }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: 99px; padding: 2px; background: var(--panel); gap: 2px; flex-wrap: wrap; }
.seg-ctl .btn { border: 0; padding: 7px 11px; }
.seg-ctl .lbl { font-family: var(--f-mono); font-size: 0.68rem; color: var(--ink-3); align-self: center; padding: 0 4px 0 8px; }
.chk { font-family: var(--f-display); font-size: 0.84rem; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
.chk input { accent-color: var(--accent); }
.spacer { flex: 1; }

/* Hero */
#L-hero { align-items: center; justify-content: center; text-align: center; }
#L-hero .viz { width: min(100%, 460px); flex: 0 1 auto; aspect-ratio: 1; min-height: 0; }
.cta { font-size: 1.05rem; padding: 13px 22px; }
.cta-sub { font-size: 0.9rem; color: var(--ink-2); max-width: 26rem; }

/* Pump */
.chain { display: flex; align-items: stretch; }
.chip { flex: 1 1 0; min-width: 0; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); padding: 6px 4px; text-align: center; transition: border-color .2s, box-shadow .2s, transform .2s; }
.chip .rn { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.1; }
.chip .cn { font-size: 0.78rem; color: var(--ink-2); line-height: 1.2; }
.chip .rq { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.lit { border-color: var(--mc, var(--just)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--mc, var(--just)) 35%, transparent); transform: translateY(-2px); }
.link { flex: 0 0 auto; width: 48px; display: grid; place-items: center; align-content: center; font-family: var(--f-mono); font-size: 0.62rem; color: var(--ink-3); text-align: center; line-height: 1.15; }
.link b { color: var(--ink-2); font-size: 0.7rem; }
.link.jump b { color: var(--warn); }
.readout { display: flex; gap: 6px 20px; flex-wrap: wrap; align-items: baseline; }
.readout div { display: grid; }
.readout .lbl { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.readout b { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.readout b.sm { font-size: 0.95rem; font-family: var(--f-mono); font-weight: 600; padding-top: 6px; }
.readout b.txt { font-size: 0.95rem; font-family: var(--f-display); font-weight: 600; padding-top: 6px; }
#pr-c.flat { color: var(--just); }
.eqbox { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: min(94%, 430px); background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--rule); border-radius: 14px; padding: 9px 14px; font-size: 0.9rem; line-height: 1.5; text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; }
.eqbox.on { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-2); min-height: 1.2em; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* Temperaments */
.ttab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.86rem; }
.ttab th, .ttab td { padding: 5px 6px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
.ttab th { font-family: var(--f-display); font-weight: 600; font-size: 0.76rem; color: var(--ink-2); }
.ttab td:first-child, .ttab th:first-child { text-align: left; font-family: var(--f-display); font-weight: 600; }
.ttab td.mono { font-family: var(--f-mono); font-size: 0.8rem; }
.ttab tr.wolf td { color: var(--just); }
.ttab tr.dim td { opacity: 0.45; }
.lamp { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--warn); vertical-align: -1px; margin-left: 6px; }
#L-temper.keys #te-cv, #L-temper:not(.keys) #te-ring { display: none; }
.wedge { cursor: pointer; }
.wedge:focus { outline: none; }
.wedge:focus-visible path { stroke: var(--accent); stroke-width: 3; }

/* Lattice */
#lat-read { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); min-height: 2.9em; line-height: 1.45; }
#lat-read b { color: var(--ink); }
.lnode { cursor: pointer; }
.lnode:focus { outline: none; }
.lnode:focus-visible circle { stroke: var(--accent); stroke-width: 3.5; }
.ltri { cursor: pointer; }

/* Sound bar */
.soundbar { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; gap: 8px; align-items: center; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--rule); border-radius: 99px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.12); backdrop-filter: blur(6px); }
.soundbar .btn { padding: 8px 12px; }
.soundbar .vol { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-3); padding-left: 4px; }
.soundbar input[type=range] { width: 90px; accent-color: var(--accent); }
.soundbar [hidden] { display: none !important; }
#snd-on.live { background: var(--good); border-color: var(--good); color: #fff; }

/* Appendix */
.after { max-width: 54rem; margin: 0 auto; padding: 10vh 0 140px; }
.after .lede { color: var(--ink-2); max-width: 40rem; }
.tablewrap { overflow-x: auto; margin: 0.4rem 0 1.4rem; }
.ntab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.ntab th, .ntab td { padding: 7px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
.ntab th:first-child, .ntab td:first-child { text-align: left; }
.ntab th { font-family: var(--f-display); font-size: .82rem; color: var(--ink-2); font-weight: 600; }
.ntab td.mono { font-family: var(--f-mono); font-size: .86rem; }
.ntab td.l { text-align: left; color: var(--ink-2); font-size: .9rem; white-space: normal; }
.after ul { padding-left: 1.2rem; }
.after li { margin-bottom: .4rem; }

/* Phones: stage pinned on top, text flows underneath it, one build per paragraph */
@media (max-width: 900px) {
  body { font-size: 1.02rem; }
  .scrolly { display: flex; flex-direction: column; }
  .stage-col { order: -1; position: sticky; top: 0; z-index: 3; height: 58vh; height: var(--stage-h); background: var(--bg); }
  .stage { position: relative; height: 100%; padding-block: 8px 6px; }
  .stage-inner { border-radius: 16px; }
  .layer { padding: 74px 12px 10px; gap: 7px; }
  .lay-sub, .chapters, .hide-phone { display: none !important; }
  .subnav { top: 46px; }
  .step, .step:first-child, .step.tall { min-height: 0; display: block; padding-bottom: 16vh; }
  .step .card, .step.tall .card { position: static; padding-block: 18px 0; max-width: none; opacity: .35; visibility: visible; transition: opacity .35s; }
  .step.cur .card { opacity: 1; }
  .card [data-b] { margin-bottom: 38vh; transition: opacity .35s; }
  .card [data-b]:last-child { margin-bottom: 0; }
  .card [data-b].fut, .card [data-b].past { display: block; opacity: .38; }
  .card [data-b].now { animation: none; }
  .steps { padding-bottom: 20vh; }
  h1 { font-size: 2.3rem; }
  h2 { font-size: 1.35rem; }
  .readout { gap: 2px 14px; }
  .readout b { font-size: 1.15rem; }
  .readout b.sm, .readout b.txt { font-size: 0.8rem; padding-top: 3px; }
  .link { width: 31px; font-size: 0.52rem; }
  .legend { font-size: 0.62rem; gap: 0 10px; }
  .link span { display: none; }
  .chip .rq { font-size: 0.6rem; }
  .btn { font-size: 0.8rem; padding: 7px 10px; }
  .ttab { font-size: 0.74rem; }
  .ttab th, .ttab td { padding: 3px 4px; }
  #L-temper.keys .ttab { display: none; }
  .soundbar { left: 12px; right: 12px; justify-content: center; border-radius: 16px; }
  .soundbar input[type=range] { width: 70px; }
  #L-hero .viz { width: min(70%, 260px); }
  .after { padding-top: 6vh; }
}
@media (prefers-reduced-motion: reduce) {
  .layer, .step .card, .card [data-b] { transition: none !important; animation: none !important; }
}
</style>
<style id="slop-css">
/* Slop editor: who wrote what (see slop.js). MIT license.
   Each category's color comes from the page's text block (picked in the editor), or --slop-<id> in the page's CSS
   (--slop-ai, --slop-ok, --slop-data, --slop-me), or a default for the page's background: slop.js puts .slop-dark on
   <html> when it's dark, and writes the colors into a stylesheet of its own. --slop-font and --slop-mono set the
   editor's fonts. */
html {
  --_accent: #6d35d0;
  --_font: var(--slop-font, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  --_mono: var(--slop-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
  /* the editor's own surface */
  --_bg: #fdfcfa; --_sunk: #f4f2ee; --_ink: #1e1b24; --_ink-2: #57525f; --_ink-3: #8b8694; --_rule: #e5e1e8;
  --_shadow: 0 1px 2px rgb(30 20 40 / 0.06), 0 18px 48px rgb(30 20 40 / 0.16);
}
html.slop-dark {
  --_accent: #b892ff;
  --_bg: #1b1920; --_sunk: #131217; --_ink: #f1eef5; --_ink-2: #bdb7c6; --_ink-3: #8a8494; --_rule: #2f2c36;
  --_shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 18px 48px rgb(0 0 0 / 0.5);
}
.slop-data { font-variant-numeric: tabular-nums; }

/* ---------- Slop-o-meter ---------- */
.slop-meter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 16px; font: 0.78rem/1.4 var(--_font); }
.slop-meter-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 5px; border-radius: 99px;
  border: 1px solid color-mix(in srgb, currentColor 22%, transparent); background: transparent; color: inherit;
  font: 600 0.78rem var(--_font); letter-spacing: 0.01em; cursor: pointer;
}
.slop-meter-btn:hover { border-color: var(--slop-c-ai, var(--_accent)); }
.slop-meter-btn:focus-visible { outline: 2px solid var(--_accent); outline-offset: 2px; }
.slop-switch { position: relative; width: 26px; height: 15px; border-radius: 99px; background: color-mix(in srgb, currentColor 22%, transparent); transition: background .2s; }
.slop-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.3); transition: transform .2s; }
.slop-meter-btn[aria-pressed="true"] { border-color: var(--slop-c-ai, var(--_accent)); }
.slop-meter-btn[aria-pressed="true"] .slop-switch { background: var(--slop-c-ai, var(--_accent)); }
.slop-meter-btn[aria-pressed="true"] .slop-switch::after { transform: translateX(11px); }
.slop-meter-key { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
/* what readers see: nothing (the default), the pie with its legend, or that and the switch that colors the words */
.slop-meter:not([data-show]), .slop-meter[data-show="nothing"] { display: none; }
.slop-meter[data-show="pie"] .slop-meter-btn { display: none; }
.slop-pct { margin-left: 5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.slop-pie { flex: none; width: 18px; height: 18px; border-radius: 50%; background: color-mix(in srgb, currentColor 20%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 15%, transparent); }
.slop-legend { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; font-weight: 600; }
.slop-key { display: inline-flex; align-items: center; gap: 5px; }
.slop-key i { width: 8px; height: 8px; border-radius: 50%; }

/* ---------- the editor ---------- */
.slop-edit-btn, .slop-panel { font-family: var(--_font); color: var(--_ink); -webkit-font-smoothing: antialiased; }
.slop-edit-btn, .slop-panel *, .slop-panel { box-sizing: border-box; }
.slop-edit-btn {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 2147483000;
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px 10px 12px; border-radius: 99px;
  border: 1px solid var(--_accent); background: var(--_bg); color: var(--_accent); font: 600 0.88rem var(--_font); cursor: pointer; box-shadow: var(--_shadow);
}
.slop-edit-btn::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--slop-c-ai, var(--_accent)); }
.slop-edit-btn:hover { background: color-mix(in srgb, var(--_accent) 10%, var(--_bg)); }
.slop-edit-btn[hidden], .slop-panel[hidden], .slop-panel [hidden] { display: none !important; }

.slop-panel {
  position: fixed; top: 12px; right: 12px; bottom: 12px; z-index: 2147483000; width: min(420px, calc(100vw - 24px));
  display: flex; flex-direction: column; background: var(--_bg); border: 1px solid var(--_rule); border-radius: 16px;
  box-shadow: var(--_shadow); font-size: 14px; line-height: 1.4; text-align: left;
}
.slop-panel button { font-family: inherit; color: inherit; }
.slop-panel :focus-visible { outline: 2px solid var(--_accent); outline-offset: 1px; }
.slop-panel p { margin: 0; }

.sp-head { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 14px 10px 16px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.slop-dragging, .slop-dragging * { user-select: none !important; -webkit-user-select: none !important; }
.slop-dragging .sp-head { cursor: grabbing; }
.sp-grip { position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--_rule); }
.sp-head:hover .sp-grip { background: var(--_ink-3); }
.sp-head h2 { margin: 0; font: 700 1.02rem/1.3 var(--_font); color: var(--_ink); }
.sp-status { margin-top: 2px; font-size: 0.78rem; color: var(--_ink-3); min-height: 1.4em; }
.sp-status[data-kind="dirty"] { color: var(--_ink-2); }
.sp-status[data-kind="error"] { color: #d0453a; }
.sp-link { padding: 0; border: 0; background: none; color: var(--_accent) !important; font: 600 0.78rem var(--_font); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.sp-save { flex: none; margin-left: auto; height: 30px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--_accent); background: var(--_accent); color: var(--_bg) !important; font: 600 0.82rem var(--_font); font-variant-numeric: tabular-nums; cursor: pointer; }
.sp-save:hover:not(:disabled) { filter: brightness(1.1); }
.sp-save:disabled { border-color: var(--_rule); background: none; color: var(--_ink-3) !important; cursor: default; }
.sp-revert { flex: none; padding: 0 2px; border: 0; background: none; font: 600 0.72rem var(--_font); color: var(--_ink-3) !important; text-decoration: underline; text-decoration-color: var(--_rule); text-underline-offset: 2px; cursor: pointer; }
.sp-revert:hover { color: var(--_ink) !important; text-decoration-color: currentColor; }
.sp-close { flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--_rule); background: none; font-size: 1.2rem; line-height: 1; cursor: pointer; }
.sp-close:hover { background: var(--_sunk); }
/* resize handles along every edge and corner */
.sp-edge { position: absolute; z-index: 2; touch-action: none; }
.sp-edge[data-edge="n"], .sp-edge[data-edge="s"] { left: 14px; right: 14px; height: 8px; cursor: ns-resize; }
.sp-edge[data-edge="e"], .sp-edge[data-edge="w"] { top: 14px; bottom: 14px; width: 8px; cursor: ew-resize; }
.sp-edge[data-edge="n"] { top: -4px; } .sp-edge[data-edge="s"] { bottom: -4px; }
.sp-edge[data-edge="e"] { right: -4px; } .sp-edge[data-edge="w"] { left: -4px; }
.sp-edge[data-edge="ne"], .sp-edge[data-edge="nw"], .sp-edge[data-edge="se"], .sp-edge[data-edge="sw"] { width: 16px; height: 16px; }
.sp-edge[data-edge="ne"] { top: -4px; right: -4px; cursor: nesw-resize; } .sp-edge[data-edge="sw"] { bottom: -4px; left: -4px; cursor: nesw-resize; }
.sp-edge[data-edge="nw"] { top: -4px; left: -4px; cursor: nwse-resize; } .sp-edge[data-edge="se"] { bottom: -4px; right: -4px; cursor: nwse-resize; }

/* the whole page: how much is slop, the page's switch, and the categories */
.sp-cover { display: grid; gap: 10px; padding: 0 16px 14px; }
.sp-cover-row { display: flex; align-items: center; gap: 10px; }
.sp-big { font-size: 0.9rem; color: var(--_ink-2); }
.sp-big b { font: 700 1.55rem/1 var(--_font); color: var(--slop-c-ai, var(--_accent)); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.sp-words { margin-right: auto !important; font-size: 0.78rem; color: var(--_ink-3); font-variant-numeric: tabular-nums; }
.sp-cover-row .sp-pie { width: 22px; height: 22px; }
.sp-cats { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-cat { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px 0 4px; border: 1px solid var(--_rule); border-radius: 99px; font-size: 0.78rem; }
.sp-swatch { position: relative; flex: none; width: 18px; height: 18px; border-radius: 50%; overflow: hidden; cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--_ink) 18%, transparent); }
.sp-swatch:hover { box-shadow: 0 0 0 2px var(--_rule), inset 0 0 0 1px color-mix(in srgb, var(--_ink) 18%, transparent); }
.sp-swatch input { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); padding: 0; border: 0; opacity: 0; cursor: pointer; }
.sp-cat-name { min-width: 3ch; padding: 0; border: 0; border-radius: 4px; background: none; font: 600 0.78rem var(--_font); color: var(--_ink); }
.sp-cat-name:hover { background: var(--_sunk); }
.sp-cat-name:focus { outline: none; background: var(--_sunk); }
.sp-cat-pct { font-weight: 500; color: var(--_ink-3); font-variant-numeric: tabular-nums; }
.sp-cat-x { margin: 0 -3px 0 -2px; padding: 0 3px; border: 0; background: none; color: var(--_ink-3) !important; font-size: 1rem; line-height: 1; cursor: pointer; }
.sp-cat-x:hover { color: var(--_ink) !important; }
.sp-show { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: var(--_ink-3); }
.sp-seg { display: flex; flex: 1; gap: 2px; padding: 2px; border-radius: 8px; background: var(--_sunk); }
.sp-seg button { flex: 1; padding: 4px 6px; border: 0; border-radius: 6px; background: none; font-size: 0.76rem; font-weight: 600; color: var(--_ink-2); cursor: pointer; white-space: nowrap; }
.sp-seg button[aria-checked="true"] { background: var(--_bg); color: var(--_ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.sp-seg button:hover:not([aria-checked="true"]) { color: var(--_ink); }
.sp-cat-add, .sp-cat-new { height: 28px; padding: 0 11px; border: 1px dashed var(--_rule); border-radius: 99px; background: none; font: 600 0.78rem var(--_font); color: var(--_ink-2); cursor: pointer; }
.sp-cat-add:hover { border-color: var(--_ink-3); color: var(--_ink); }
.sp-cat-new { width: 150px; border-style: solid; border-color: var(--_accent); color: var(--_ink); cursor: text; outline: none; }

/* tabs */
.sp-tabs { display: flex; gap: 2px; margin: 0 12px; padding: 3px; border-radius: 10px; background: var(--_sunk); }
.sp-tabs button { flex: 1; padding: 6px 8px; border: 0; border-radius: 7px; background: none; color: var(--_ink-2); font-size: 0.82rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.sp-tabs button span { margin-left: 3px; font-weight: 500; color: var(--_ink-3); font-variant-numeric: tabular-nums; }
.sp-tabs button[aria-selected="true"] { background: var(--_bg); color: var(--_ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.sp-tabs button:hover:not([aria-selected="true"]) { color: var(--_ink); }

.sp-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 12px 20px; }
.sp-intro { padding: 6px 4px 10px; font-size: 0.8rem; color: var(--_ink-3); }
.sp-empty { padding: 28px 12px; text-align: center; color: var(--_ink-3); font-size: 0.86rem; }

/* sections */
.sp-group { border-bottom: 1px solid var(--_rule); }
.sp-group summary { display: flex; align-items: center; gap: 8px; padding: 10px 4px; cursor: pointer; list-style: none; }
.sp-group summary::-webkit-details-marker { display: none; }
.sp-group summary::before { content: ""; flex: none; width: 6px; height: 6px; margin: 0 3px 0 1px; border: solid var(--_ink-3); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; }
.sp-group[open] summary::before { transform: rotate(45deg) translate(-2px, 0); }
.sp-gname { font-weight: 700; font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-gnote { margin-left: auto; font-size: 0.74rem; color: var(--_ink-3); white-space: nowrap; }
.sp-group > .sp-field:last-child { margin-bottom: 14px; }

/* one text */
.sp-field { display: grid; gap: 5px; margin: 0 2px 12px 18px; padding: 2px; border-radius: 10px; transition: background .4s; }
.sp-body > .sp-field { margin-left: 2px; }
.sp-flash { background: color-mix(in srgb, var(--_accent) 14%, transparent); }
.sp-flabel { display: flex; align-items: center; gap: 6px; min-height: 24px; }
.sp-flabel label { min-width: 0; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.76rem; font-weight: 600; color: var(--_ink-3); }
.sp-field textarea {
  display: block; width: 100%; margin: 0; padding: 7px 9px; resize: none; overflow: hidden;
  font: 0.86rem/1.5 var(--_mono); color: var(--_ink); background: var(--_sunk); border: 1px solid transparent; border-radius: 8px;
}
.sp-field textarea:hover { border-color: var(--_rule); }
.sp-field textarea:focus { outline: none; border-color: var(--_accent); background: var(--_bg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--_accent) 18%, transparent); }
.sp-unseen { flex: none; padding: 1px 6px; border: 0; border-radius: 4px; background: var(--_sunk); font: 600 0.68rem var(--_font); color: var(--_ink-3) !important; cursor: help; }
.sp-unseen:not(:disabled) { color: var(--_accent) !important; cursor: pointer; }
.sp-unseen:not(:disabled):hover { background: color-mix(in srgb, var(--_accent) 12%, transparent); }
.sp-hint { padding: 2px 2px 0; font-size: 0.76rem; color: var(--_ink-2); }

/* a pie of what the text is made of, and its slop switch */
.sp-ctl { flex: none; display: inline-flex; align-items: center; gap: 7px; }
.sp-pie { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--_rule); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--_ink) 14%, transparent); }
.sp-toggle {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 4px; border: 1px solid var(--_rule); border-radius: 99px;
  background: var(--_bg); font-size: 0.74rem; font-weight: 600; color: var(--_ink-3); cursor: pointer;
}
.sp-switch { position: relative; flex: none; width: 24px; height: 14px; border-radius: 99px; background: var(--slop-c-ok, #17805a); transition: background .2s; }
.sp-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 0.3); transition: transform .2s; }
.sp-toggle[aria-checked="true"] { color: var(--slop-c-ai, var(--_accent)); border-color: color-mix(in srgb, var(--slop-c-ai, var(--_accent)) 45%, var(--_rule)); }
.sp-toggle[aria-checked="true"] .sp-switch { background: var(--slop-c-ai, var(--_accent)); }
.sp-toggle[aria-checked="true"] .sp-switch::after { transform: translateX(10px); }
.sp-toggle:hover:not(:disabled) { border-color: var(--_ink-3); }
.sp-still .sp-switch, .sp-still .sp-switch::after { transition: none; }
.sp-toggle:disabled { opacity: 0.45; cursor: default; }
.sp-toggle:disabled .sp-switch { background: var(--_rule); }

/* marking text: shown under the focused text */
.sp-assign { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding-top: 2px; }
.sp-assign-label { margin-right: 2px; font-size: 0.72rem; color: var(--_ink-3); }
.sp-as { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border: 1px solid var(--_rule); border-radius: 99px; background: var(--_bg); font-size: 0.72rem; font-weight: 600; color: var(--_ink-2) !important; cursor: pointer; }
.sp-as i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--_ink) 15%, transparent); }
.sp-as:hover { border-color: var(--_ink-3); color: var(--_ink) !important; }

/* the repeat badge: the same words are elsewhere too */
.sp-rep {
  flex: none; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px 0 6px; border-radius: 6px;
  border: 1px dashed color-mix(in srgb, var(--_accent) 55%, var(--_rule)); background: none; color: var(--_accent) !important;
  font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer;
}
.sp-rep::before { content: ""; width: 9px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; box-shadow: 2.5px -2.5px 0 -1px var(--_bg), 2.5px -2.5px 0 0.5px currentColor; margin-right: 2px; }
.sp-rep:hover { background: color-mix(in srgb, var(--_accent) 10%, transparent); }

/* Repeats: one card per repeated text */
.sp-set { margin: 0 0 12px; padding: 10px; border: 1px solid var(--_rule); border-radius: 12px; }
.sp-set .sp-flabel label { color: var(--_accent); }
.sp-where { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.sp-goto { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 8px 3px 5px; border: 1px solid var(--_rule); border-radius: 6px; background: none; font-size: 0.74rem; color: var(--_ink-2) !important; cursor: pointer; }
.sp-goto:hover { border-color: var(--_ink-3); color: var(--_ink) !important; }
.sp-pie.sp-mini { width: 10px; height: 10px; }

/* on the page, while the editor is open */
.slop-editing [data-slop] { cursor: text; }
.slop-editing [data-slop]:hover { outline: 1px dashed color-mix(in srgb, var(--_accent) 60%, transparent); outline-offset: 3px; border-radius: 2px; }
.slop-focus { outline: 2px solid var(--_accent) !important; outline-offset: 3px; border-radius: 2px; }
.slop-copy { outline: 2px dashed var(--_accent) !important; outline-offset: 3px; border-radius: 2px; }

@media (max-width: 900px) {
  .slop-panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 60svh; }
  .sp-head { cursor: ns-resize; }
  .sp-edge:not([data-edge="n"]) { display: none; }
}
</style>
</head>
<body>

<div class="scrolly">
  <div class="steps">

    <section class="step" data-scene="hero">
      <div class="card">
        <div data-slop-meter></div>
        <div class="eyebrow" data-slop="hero.eyebrow"></div>
        <h1 data-slop="hero.title"></h1>
        <p data-slop="hero.p1"></p>
        <p data-slop="hero.p2"></p>
        <p class="note" data-slop="hero.note"></p>
      </div>
    </section>

    <section class="step tall" data-scene="pure" data-n="4" style="--n:4">
      <div class="card">
        <div class="eyebrow" data-slop="pure.eyebrow"></div>
        <h2 data-slop="pure.title"></h2>
        <p data-b="0" data-slop="pure.p1"></p>
        <p data-b="1" data-slop="pure.p2"></p>
        <p data-b="2" data-slop="pure.p3"></p>
        <p data-b="3" data-slop="pure.p4"></p>
      </div>
    </section>

    <section class="step tall" data-scene="stack" data-n="3" style="--n:3">
      <div class="card">
        <div class="eyebrow" data-slop="stack.eyebrow"></div>
        <h2 data-slop="stack.title"></h2>
        <p data-b="0" data-slop="stack.p1"></p>
        <p data-b="1" data-slop="stack.p2"></p>
        <p data-b="2" data-slop="stack.p3"></p>
      </div>
    </section>

    <section class="step tall" data-scene="pump" data-n="5" style="--n:5">
      <div class="card">
        <div class="eyebrow" data-slop="pump.eyebrow"></div>
        <h2 data-slop="pump.title"></h2>
        <p data-b="0" data-slop="pump.p1"></p>
        <p data-b="1" data-slop="pump.p2"></p>
        <p data-b="2" data-slop="pump.p3"></p>
        <p data-b="3" data-slop="pump.p4"></p>
        <p data-b="4" data-slop="pump.p5"></p>
      </div>
    </section>

    <section class="step tall" data-scene="temper" data-n="5" style="--n:5">
      <div class="card">
        <div class="eyebrow" data-slop="temper.eyebrow"></div>
        <h2 data-slop="temper.title"></h2>
        <p data-b="0" data-slop="temper.p1"></p>
        <p data-b="1" data-slop="temper.p2"></p>
        <p data-b="2" data-slop="temper.p3"></p>
        <p data-b="3" data-slop="temper.p4"></p>
        <p data-b="4" data-slop="temper.p5"></p>
      </div>
    </section>

    <section class="step tall" data-scene="lattice" data-n="2" style="--n:2">
      <div class="card">
        <div class="eyebrow" data-slop="lattice.eyebrow"></div>
        <h2 data-slop="lattice.title"></h2>
        <p data-b="0" data-slop="lattice.p1"></p>
        <p data-b="1" data-slop="lattice.p2"></p>
      </div>
    </section>

  </div>

  <div class="stage-col" id="stagecol">
    <div class="stage">
      <div class="stage-inner" id="stage">
        <div class="nav">
          <button class="key" id="k-prev" aria-label="Previous">←</button>
          <div class="segs" id="segs"></div>
          <button class="key" id="k-next" aria-label="Next">→</button>
        </div>
        <div class="subnav">
          <div class="slideno" id="slideno"></div>
          <div class="chapters" id="chapters"></div>
        </div>

        <!-- Front page -->
        <div class="layer" id="L-hero">
          <div class="viz"><svg id="hero-svg" viewBox="-108 -108 216 216" role="img" aria-label="Twelve pure fifths drawn on a spiral, one turn per octave; the last one overshoots C"></svg></div>
          <button class="btn primary cta" id="hero-snd">🔊 Enable sound</button>
          <div class="cta-sub" data-slop="hero.stage.caption"></div>
        </div>

        <!-- 1 Pure intervals -->
        <div class="layer" id="L-pure">
          <div class="lay-head"><div class="lay-title" id="pu-title">Octave 2:1</div><div class="lay-sub" id="pu-sub"></div></div>
          <div class="viz"><canvas id="pu-cv" role="img" aria-label="The two waves, their sum, and both overtone ladders with coinciding harmonics joined"></canvas></div>
          <div class="ctrls">
            <div class="seg-ctl" id="pu-ints"></div>
            <span class="spacer"></span>
            <button class="btn primary" data-act="pu-play">▶ Together</button>
            <button class="btn" data-act="pu-apart">▶ Apart</button>
          </div>
        </div>

        <!-- 2 Stacking -->
        <div class="layer" id="L-stack">
          <div class="lay-head"><div class="lay-title" id="st-title"></div><div class="lay-sub" id="st-sub"></div></div>
          <div class="viz"><svg id="st-svg" viewBox="-110 -112 220 262" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A spiral of stacked intervals and the gap where it misses the octave"></svg></div>
          <div class="ctrls">
            <div class="seg-ctl"><button class="btn" data-act="st-mode" data-v="fifths">12 fifths</button><button class="btn" data-act="st-mode" data-v="thirds">3 thirds</button></div>
            <span class="spacer"></span>
            <button class="btn primary" data-act="st-play">▶ Play the stack</button>
            <button class="btn" data-act="st-cmp">▶ Compare</button>
          </div>
        </div>

        <!-- 3 Pump -->
        <div class="layer" id="L-pump">
          <div class="chain" id="chain"></div>
          <div class="readout">
            <div><span class="lbl">Tonic vs. start</span><b id="pr-c">0.0 ¢</b></div>
            <div><span class="lbl">Ratio to first C</span><b class="sm" id="pr-r">1/1</b></div>
            <div class="hide-phone"><span class="lbl">Loop</span><b class="sm" id="pr-l">–</b></div>
            <div><span class="lbl">The comma goes</span><b class="txt" id="pr-g">–</b></div>
          </div>
          <div class="viz"><canvas id="pump-cv" role="img" aria-label="Chart of each chord's root in cents against equal temperament: the pure-tuned loop steps down a comma every time around"></canvas><div class="eqbox" id="eqbox"></div></div>
          <div class="legend" id="pump-legend"></div>
          <div class="ctrls">
            <button class="btn primary" data-act="pump" data-v="just">▶ Pure, held<span class="hide-phone"> notes</span></button>
            <button class="btn" data-act="pump" data-v="fixed">▶ Pure, fixed C</button>
            <button class="btn" data-act="pump" data-v="et">▶ Equal</button>
          </div>
          <div class="ctrls">
            <label class="chk"><input type="checkbox" id="drone" checked> Reference C</label>
            <span class="spacer"></span>
